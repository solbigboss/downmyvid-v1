<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DownMyVid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 350px;
      background: #0b111e;
      color: #ffffff;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #00f2fe;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }
    .brand svg {
      width: 20px;
      height: 20px;
      fill: #3bb3ff;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .input-wrap {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      background: #141b2d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: all 0.15s ease;
      box-shadow: inset 0px 2px 4px rgba(0,0,0,0.4);
    }
    input:focus {
      border-color: #00f2fe;
      box-shadow: inset 0px 2px 4px rgba(0,0,0,0.4), 0 0 10px rgba(0, 242, 254, 0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-paste {
      background: #1c2638;
      color: #94a3b8;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0px 1px 1px rgba(255,255,255,0.1);
    }
    .btn-paste:hover {
      color: #ffffff;
      background: #273752;
    }
    .btn-download {
      width: 100%;
      background: linear-gradient(180deg, #3bb3ff 0%, #007bff 100%);
      color: #ffffff;
      padding: 11px 16px;
      box-shadow:
        inset 0px 2px 2px rgba(255, 255, 255, 0.4),
        inset 0px -2px 4px rgba(0, 0, 0, 0.3),
        0px 6px 14px rgba(0, 123, 255, 0.45);
      text-shadow: 0px 1px 2px rgba(0,0,0,0.25);
      margin-bottom: 12px;
    }
    .btn-download:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-download:active {
      transform: scale(0.97);
    }
    .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    #status {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      min-height: 18px;
      margin-bottom: 10px;
    }
    .formats-box {
      display: none;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
    }
    .format-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141b2d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      color: white;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .format-item:hover {
      border-color: #00f2fe;
      background: #1c2638;
      transform: translateY(-1px);
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
    }
    .footer-links a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-links a:hover {
      color: #00f2fe;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 15.586l-4.293-4.293-1.414 1.414L12 18.414l5.707-5.707-1.414-1.414L12 15.586zM11 4h2v10h-2V4zM4 19h16v2H4v-2z"/></svg>
      <span>DownMyVid</span>
    </div>
    <span class="badge">V3 Extension</span>
  </div>

  <div class="input-wrap">
    <input type="text" id="urlInput" placeholder="Paste YouTube, X, or Instagram link..." />
    <button class="btn btn-paste" id="pasteBtn" title="Paste from clipboard">📋 Paste</button>
  </div>

  <button class="btn btn-download" id="extractBtn">
    ⚡ Fetch Formats
  </button>

  <div id="status"></div>

  <div class="formats-box" id="formatsBox"></div>

  <div class="footer-links">
    <a href="https://downmyvid.com" target="_blank">🌐 Web Downloader</a>
    <a href="https://downmyvid.com/blog" target="_blank">📰 Guides & Blog</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
