<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Social Downloader UI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b111e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .downloader-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 700px;
    }
    .social-icons {
      display: flex;
      gap: 16px;
    }
    .icon-btn {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      color: white;
      position: relative;
      transition: all 0.2s ease;
      background: linear-gradient(180deg, #2a354d, #141b2d);
      box-shadow: 
        inset 0px 2px 2px rgba(255, 255, 255, 0.15), 
        inset 0px -4px 6px rgba(0, 0, 0, 0.4), 
        0px 10px 15px rgba(0, 0, 0, 0.5);
    }
    .icon-btn:active {
      transform: scale(0.95);
    }
    .icon-btn.globe { color: #3bb3ff; }
    .icon-btn.x-twitter { color: #a1a1aa; }
    .icon-btn.instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.4), inset 0px -4px 6px rgba(0, 0, 0, 0.3), 0px 10px 15px rgba(0, 0, 0, 0.5);
    }
    .icon-btn.facebook {
      background: linear-gradient(180deg, #4267B2, #2d4a86);
      box-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.3), inset 0px -4px 6px rgba(0, 0, 0, 0.4), 0px 10px 15px rgba(0, 0, 0, 0.5);
    }
    .icon-btn.youtube {
      background: linear-gradient(180deg, #ff4e4e, #cc0000);
      box-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.4), inset 0px -4px 6px rgba(0, 0, 0, 0.3), 0px 10px 15px rgba(204, 0, 0, 0.2);
    }
    .icon-btn.active.tiktok {
      border: 2px solid #00f2fe;
      background: linear-gradient(180deg, #1c2638, #0b111e);
      box-shadow: 
        0px 0px 20px rgba(0, 242, 254, 0.6), 
        inset 0px 2px 4px rgba(255, 255, 255, 0.2), 
        inset 0px -4px 6px rgba(0, 0, 0, 0.6);
    }
    .icon-btn.active::before {
      content: attr(data-tooltip);
      position: absolute;
      top: -36px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: white;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    }
    .input-bar {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 8px 8px 8px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0px 15px 25px rgba(0, 0, 0, 0.4);
    }
    .input-bar i {
      color: #00f2fe;
      margin-right: 12px;
      font-size: 18px;
    }
    .input-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .input-bar input::placeholder {
      color: #64748b;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-paste {
      background: linear-gradient(180deg, #2a354d, #141b2d);
      color: #94a3b8;
      margin-right: 8px;
      box-shadow: inset 0px 1px 1px rgba(255, 255, 255, 0.1), inset 0px -2px 4px rgba(0, 0, 0, 0.3), 0px 4px 6px rgba(0, 0, 0, 0.2);
    }
    .btn-download {
      background: linear-gradient(180deg, #3bb3ff, #007bff);
      color: white;
      box-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.3), inset 0px -4px 6px rgba(0, 0, 0, 0.2), 0px 6px 12px rgba(0, 123, 255, 0.4);
      text-shadow: 0px 1px 2px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="downloader-widget">
    <div class="social-icons">
      <button class="icon-btn globe"><i class="fa-solid fa-globe"></i></button>
      <button class="icon-btn x-twitter"><i class="fa-brands fa-x-twitter"></i></button>
      <button class="icon-btn active tiktok" data-tooltip="TikTok"><i class="fa-brands fa-tiktok"></i></button>
      <button class="icon-btn instagram"><i class="fa-brands fa-instagram"></i></button>
      <button class="icon-btn facebook"><i class="fa-brands fa-facebook-f"></i></button>
      <button class="icon-btn threads"><i class="fa-brands fa-threads"></i></button>
      <button class="icon-btn youtube"><i class="fa-brands fa-youtube"></i></button>
    </div>
    <div class="input-bar">
      <i class="fa-solid fa-globe"></i>
      <input type="text" placeholder="Paste any link (TikTok, Instagram, X/Twitter, Face...">
      <button class="btn btn-paste"><i class="fa-regular fa-clipboard"></i> Paste</button>
      <button class="btn btn-download"><i class="fa-solid fa-download"></i> Download</button>
    </div>
  </div>
</body>
</html>
